name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Each platform builds on its own architecture rather than cross-compiling or
# emulating, so a release artifact is produced by the same toolchain CI tests
# with. The publish job runs only after all three have passed.

# Read-only by default. A job that needs to write says so itself, so a new job
# cannot quietly inherit the ability to push, release, or comment.
permissions: read-all

jobs:
  # Before three binaries are built, check the tag names the version the tree
  # declares. A mismatch here costs seconds. Caught after publishing, it costs a
  # deleted release and a moved tag.
  version:
    name: Version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the tag against project(VERSION)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/check-version.sh

      # A release with no changelog section is one nobody can read about, so it
      # fails here rather than publishing empty notes.
      - name: Check the changelog has a section for it
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/changelog-notes.sh > /dev/null

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Ninja
        run: brew install ninja

      - name: Build
        run: ./scripts/release.sh macos

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blogin-macos-universal
          path: dist/blogin-macos-universal*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build
        run: ./scripts/release.sh linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blogin-linux-${{ matrix.arch }}
          path: dist/blogin-linux-${{ matrix.arch }}*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

      # Attestation signs with a short-lived certificate issued to this
      # workflow's identity, so there is no long-lived private key anywhere.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      # Every checksum is verified here rather than trusted, so a file damaged
      # between building and publishing is caught before anybody downloads it.
      - name: Check the checksums
        run: |
          cd dist
          ls -l
          sha256sum -c ./*.sha256

      # The tag was checked against the source before the build. This checks the
      # binary that came out of it, which is the artifact people download.
      - name: Check the binary reports the tag's version
        run: |
          chmod +x dist/blogin-linux-x86_64
          reported="$(dist/blogin-linux-x86_64 --version)"
          wanted="blogin ${GITHUB_REF_NAME#v}"

          if [[ "$reported" != "$wanted" ]]; then
            echo "the binary reports '$reported', the tag wants '$wanted'" >&2
            exit 1
          fi

          echo "ok: $reported"
        shell: bash

      # One file covering every binary, so verifying a download is one command
      # against one signed manifest rather than three separate checks.
      - name: Write a combined SHA256SUMS
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum blogin-macos-universal blogin-linux-x86_64 blogin-linux-arm64 > SHA256SUMS
          cat SHA256SUMS

      # Signs each binary, and the manifest that names all three. What this
      # proves is not only that the bytes are unchanged, which the checksums
      # already cover, but that they were built by this workflow, in this
      # repository, from this commit. A checksum anyone can regenerate after
      # replacing a file. This they cannot.
      - name: Attest the binaries
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/blogin-macos-universal
            dist/blogin-linux-x86_64
            dist/blogin-linux-arm64
            dist/SHA256SUMS

      # `gh attestation verify` finds the signature through GitHub's attestation
      # store without this. Attaching it puts the same bundle on the release, so
      # the signature can be fetched and checked with the binary it covers, by
      # anything that reads a release rather than the API.
      - name: Put the attestation on the release
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/blogin.intoto.jsonl

      # The notes are the changelog's own section, so what GitHub shows and what
      # the file says are the same words.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/changelog-notes.sh > notes.md

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/SHA256SUMS dist/blogin.intoto.jsonl \
            dist/blogin-macos-universal dist/blogin-macos-universal.sha256 \
            dist/blogin-linux-x86_64 dist/blogin-linux-x86_64.sha256 \
            dist/blogin-linux-arm64 dist/blogin-linux-arm64.sha256

  # The formula points at the release assets by url and checksum, so it can only
  # be written once the release exists. A tap left behind after a release is a
  # `brew install` that fetches the previous version, which is why this runs in
  # the same workflow rather than by hand afterwards.
  tap:
    name: Tap
    needs: publish
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    # Attaching the formula to the release is a write, and a job gets the
    # read-only default until it says otherwise. The token here reaches this
    # repository only, which is why pushing to the tap uses one of its own.
    permissions:
      contents: write
    # At the job level so the push step can test for the token in its `if`. A
    # step cannot read the env it declares itself.
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
      TAP_REPOSITORY: ${{ vars.TAP_REPOSITORY || 'gdonald/homebrew-blogin' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the formula
        run: ./scripts/formula.sh "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" > blogin.rb

      # Kept on the release too, so the formula that produced a given version is
      # recoverable even if the tap moves.
      - name: Attach the formula to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" blogin.rb --clobber

      # A token for the tap repository, since the built-in one reaches only this
      # one. Without the secret the formula is still on the release and the tap
      # is updated by hand.
      - name: Push it to the tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" tap
          mkdir -p tap/Formula
          cp blogin.rb tap/Formula/blogin.rb

          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Staged first, then compared. `git diff` on its own ignores untracked
          # files, so on the first release, when Formula/blogin.rb is new rather
          # than changed, it would report nothing to do and never push.
          git add Formula/blogin.rb

          if git diff --cached --quiet; then
            echo "the tap already has this formula"
            exit 0
          fi

          git commit -m "blogin ${GITHUB_REF_NAME}"

          # HEAD rather than a branch name, since a repository with no commits
          # yet has an unborn branch whose name is whatever the remote defaults
          # to.
          git push -u origin HEAD
