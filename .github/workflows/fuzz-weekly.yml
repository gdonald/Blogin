name: Fuzz

# Thirty seconds per target on a pull request finds the input that breaks
# immediately. A minute per target on a schedule reaches a little further, and
# the cached corpus is what carries coverage forward rather than the length of
# any one run. Each target gets its own runner so the whole set finishes in the
# time one takes.
#
# The corpus a run grows is cached and handed to the next one, so coverage
# accumulates across weeks instead of restarting from the checked-in seeds.

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to spend on each target
        required: false
        default: '60'

concurrency:
  group: fuzz-weekly
  cancel-in-progress: false

# Read-only by default. A job that needs to write says so itself, so a new job
# cannot quietly inherit the ability to push, release, or comment.
permissions: read-all

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - markdown
          - template
          - haml
          - json
          - yaml
          - config
          - expression
          - shortcode
          - http
          - path
          - websocket
          - text
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # restore-keys means a run starts from the most recent cache for this
      # target even when today's key does not exist yet.
      - name: Restore the accumulated corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Build the image
        run: docker build -t blogin-dev docker

      - name: Fuzz
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace blogin-dev bash -euo pipefail -c "
            export CXX=clang++
            export BLOGIN_FUZZ_BUILD_DIR=build-linux/fuzz
            ./scripts/fuzz.sh explore ${{ github.event.inputs.seconds || 60 }} ${{ matrix.target }}
            ./scripts/fuzz.sh minimize ${{ matrix.target }}
          "

      - name: Keep whatever crashed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

      # The corpus a run grew is what the next run starts from. It is not
      # committed: what belongs in the repository is the seed set and the
      # regression inputs, both of which a person put there on purpose.
      - name: Keep the corpus it grew
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          retention-days: 30
