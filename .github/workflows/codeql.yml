name: CodeQL

# Static analysis over the C++ sources. clang-tidy already fails the build on
# every finding it has, and the two overlap, but CodeQL reasons across function
# and file boundaries where clang-tidy reasons within one translation unit. It
# is also the check a reader looks for when asking whether the code is scanned.
#
# Weekly plus on push to main, rather than on every pull request, because a
# build of the whole tree runs here and CI already covers a push.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: c-cpp

          # The default queries plus the ones covering correctness rather than
          # only security, since a use-after-free is a bug either way.
          queries: security-and-quality

      # Every other Linux job builds in the Debian container, which carries a
      # current clang from apt.llvm.org. CodeQL has to watch the compiler run,
      # which it cannot do through docker, so this job builds on the runner. The
      # runner's clang is 18 and has no <expected>, so GCC 14 is what builds
      # here. It is a toolchain CI already covers, in the gcc job.
      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 gcc-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      # CodeQL watches a real compile rather than parsing the source, so it
      # needs the build it would analyze. This preset compiles everything the
      # binary ships.
      - name: Build
        run: |
          cmake --preset gcc-release
          cmake --build build/gcc-release -j"$(nproc)"

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
